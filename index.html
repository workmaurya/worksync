<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduShare - ScholarShare Messaging App</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2563eb",
            "primary-hover": "#1d4ed8",
            "surface": "#f8fafc",
            "surface-dark": "#0f172a",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .reaction-picker {
      display: none;
    }
    .group-message:hover .reaction-picker,
    .reaction-picker.show {
      display: flex;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white transition-colors duration-200">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Hidden File Input for Group Uploads -->
  <input type="file" id="group-file-input" accept=".pdf,image/*" class="hidden" onchange="handleGroupFileUpload(event)"/>

  <!-- Hidden File Input for DM Uploads -->
  <input type="file" id="dm-file-input" accept=".pdf,image/*" class="hidden" onchange="handleDMFileUpload(event)"/>

  <!-- APP ROOT -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Rendered dynamically by JS -->
  </div>

  <!-- Profile Edit Modal -->
  <div id="profile-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-700">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Edit Profile</h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="profile-form" onsubmit="saveProfile(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
          <input type="text" id="profile-name-input" disabled class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-500 dark:text-slate-400 text-sm cursor-not-allowed"/>
          <p class="text-xs text-slate-400 mt-1">Full name is fixed according to account allowlist.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Profile Picture URL</label>
          <input type="url" id="profile-avatar-input" placeholder="https://..." class="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Bio</label>
          <textarea id="profile-bio-input" rows="3" placeholder="Tell your peers about yourself..." class="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
          <button type="button" onclick="closeProfileModal()" class="px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Group Info Modal / Panel -->
  <div id="group-info-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-blue-600">info</span>
          <h3 class="text-lg font-bold text-slate-900 dark:text-white">Group Information</h3>
        </div>
        <button onclick="closeGroupInfoModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 flex-1">
        <!-- Group DP & Description -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700/60">
          <div class="flex flex-col sm:flex-row items-center gap-4">
            <div id="group-dp-container" class="w-20 h-20 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold text-2xl border-2 border-blue-500 shadow-md shrink-0">
              <span class="material-symbols-outlined text-3xl">groups</span>
            </div>
            <div class="flex-1 text-center sm:text-left">
              <div class="flex items-center justify-center sm:justify-start gap-2">
                <h4 id="group-name-display" class="font-bold text-lg text-slate-900 dark:text-slate-100">ScholarShare Workspace</h4>
              </div>
              <p id="group-desc-display" class="text-sm text-slate-600 dark:text-slate-400 mt-1">Official collaboration channel for homework, research, and academic discussions.</p>
            </div>
            <button id="edit-group-info-btn" onclick="toggleEditGroupInfo()" class="px-3 py-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 rounded-lg flex items-center gap-1 border border-blue-200 dark:border-blue-800">
              <span class="material-symbols-outlined text-sm">edit</span> Edit Group Info
            </button>
          </div>

          <!-- Edit Form -->
          <div id="group-info-edit-form" class="hidden mt-4 pt-4 border-t border-slate-200 dark:border-slate-700 space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Group DP URL</label>
              <input type="url" id="group-dp-input" class="w-full px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-xs"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">Group Description</label>
              <textarea id="group-desc-input" rows="2" class="w-full px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-xs"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="toggleEditGroupInfo(false)" class="px-3 py-1 text-xs text-slate-600 dark:text-slate-400">Cancel</button>
              <button type="button" onclick="saveGroupInfo()" class="px-3 py-1 text-xs text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Save</button>
            </div>
          </div>
        </div>

        <!-- Media Storage Vault -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
              <span class="material-symbols-outlined text-amber-500 text-lg">folder_shared</span>
              Media Storage Vault
            </h4>
            <span id="vault-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 font-medium">0 files</span>
          </div>
          <!-- Filter Tabs -->
          <div class="flex gap-2 border-b border-slate-200 dark:border-slate-700 pb-2 mb-3 text-xs font-medium text-slate-500">
            <button onclick="filterVault('all')" id="vault-tab-all" class="px-2 py-1 rounded-md text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30">All Files</button>
            <button onclick="filterVault('pdf')" id="vault-tab-pdf" class="px-2 py-1 rounded-md hover:text-slate-800 dark:hover:text-slate-200">PDFs</button>
            <button onclick="filterVault('image')" id="vault-tab-image" class="px-2 py-1 rounded-md hover:text-slate-800 dark:hover:text-slate-200">Images & Word</button>
            <button onclick="filterVault('other')" id="vault-tab-other" class="px-2 py-1 rounded-md hover:text-slate-800 dark:hover:text-slate-200">Other</button>
          </div>
          <div id="media-vault-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-48 overflow-y-auto p-1">
            <!-- Vault items inserted here -->
          </div>
        </div>

        <!-- Group Roster -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
              <span class="material-symbols-outlined text-emerald-500 text-lg">group</span>
              Group Roster
            </h4>
            <span class="text-xs text-slate-500">5 Members</span>
          </div>
          <div id="roster-list" class="divide-y divide-slate-200 dark:divide-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
            <!-- Roster items inserted here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ALLOWLIST & USER DATABASE
    const USERS = [
      { name: "Abhinav", password: "7474", role: "Admin", avatar: "", bio: "" },
      { name: "Vatsal", password: "9305", role: "Admin", avatar: "", bio: "" },
      { name: "Adarsh", password: "8112", role: "Admin", avatar: "", bio: "" },
      { name: "Satvik Tripathi", password: "9151", role: "Member", avatar: "", bio: "" },
      { name: "Shivam", password: "9792", role: "Member", avatar: "", bio: "" }
    ];

    // EMOJI ALLOWLIST
    const EMOJIS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];

    // INITIAL STATE & STORAGE KEYS
    let currentUser = JSON.parse(localStorage.getItem('scholarshare_current_user')) || null;
    let currentView = currentUser ? 'home' : 'login';
    let selectedDMUser = null;
    let vaultFilter = 'all';

    let userProfiles = JSON.parse(localStorage.getItem('scholarshare_profiles')) || {};
    USERS.forEach(u => {
      if (!userProfiles[u.name]) {
        userProfiles[u.name] = { avatar: u.avatar || "", bio: u.bio || "" };
      }
    });

    let darkMode = localStorage.getItem('scholarshare_dark_mode') === 'true';

    let groupInfo = JSON.parse(localStorage.getItem('scholarshare_group_info')) || {
      dp: "",
      name: "ScholarShare Workspace",
      description: "Official collaboration channel for homework, research, and academic discussions."
    };

    let notifications = JSON.parse(localStorage.getItem('scholarshare_notifications')) || [
      { id: 1, type: "system", title: "System Update", body: "ScholarShare Workspace active.", time: "1h ago", read: false }
    ];

    let groupMessages = JSON.parse(localStorage.getItem('scholarshare_group_messages')) || [];

    let dmThreads = JSON.parse(localStorage.getItem('scholarshare_dm_threads')) || {};

    // REAL-TIME SYNC ACROSS TABS / WINDOWS
    window.addEventListener('storage', (e) => {
      if (e.key === 'scholarshare_group_messages') {
        groupMessages = JSON.parse(e.newValue || '[]');
        if (currentView === 'group') render();
      } else if (e.key === 'scholarshare_dm_threads') {
        dmThreads = JSON.parse(e.newValue || '{}');
        if (currentView === 'dm') render();
      } else if (e.key === 'scholarshare_notifications') {
        notifications = JSON.parse(e.newValue || '[]');
        if (currentView === 'home') render();
      } else if (e.key === 'scholarshare_profiles') {
        userProfiles = JSON.parse(e.newValue || '{}');
        render();
      } else if (e.key === 'scholarshare_group_info') {
        groupInfo = JSON.parse(e.newValue || '{}');
        if (currentView === 'group') render();
      } else if (e.key === 'scholarshare_dark_mode') {
        darkMode = e.newValue === 'true';
        applyDarkMode();
      }
    });

    function saveState() {
      localStorage.setItem('scholarshare_current_user', JSON.stringify(currentUser));
      localStorage.setItem('scholarshare_dark_mode', darkMode);
      localStorage.setItem('scholarshare_group_info', JSON.stringify(groupInfo));
      localStorage.setItem('scholarshare_notifications', JSON.stringify(notifications));
      localStorage.setItem('scholarshare_group_messages', JSON.stringify(groupMessages));
      localStorage.setItem('scholarshare_dm_threads', JSON.stringify(dmThreads));
      localStorage.setItem('scholarshare_profiles', JSON.stringify(userProfiles));
    }

    function applyDarkMode() {
      if (darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function showToast(message, type = "error") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${
        type === 'error' ? 'bg-red-600 text-white border-red-700' :
        type === 'warning' ? 'bg-amber-500 text-white border-amber-600' :
        'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-700'
      }`;
      toast.innerHTML = `
        <span class="material-symbols-outlined text-lg">${type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'check_circle'}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function showGuardrailAlert() {
      showToast("Action Restricted: Requires Admin Privileges.", "error");
    }

    // AUTHENTICATION LOGIC WITH MINIMALIST LOGIN INTERFACE
    function login(username, password) {
      const user = USERS.find(u => u.name.trim().toLowerCase() === username.trim().toLowerCase() && u.password === password.trim());
      if (!user) {
        showToast("Invalid credentials, access denied", "error");
        return false;
      }
      currentUser = user;
      currentView = 'home';
      saveState();
      showToast(`Welcome back, ${currentUser.name}!`, "success");
      render();
      return true;
    }

    function logout() {
      currentUser = null;
      currentView = 'login';
      saveState();
      render();
    }

    function renderAvatarHTML(avatarUrl, name, sizeClasses = "w-9 h-9 text-xs") {
      if (avatarUrl && avatarUrl.trim()) {
        return `<img src="${avatarUrl}" alt="${name}" class="${sizeClasses} rounded-full object-cover border border-slate-200 dark:border-slate-700 shrink-0"/>`;
      }
      const initial = name ? name.charAt(0).toUpperCase() : '?';
      return `<div class="${sizeClasses} rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shrink-0 border border-blue-500">${initial}</div>`;
    }

    // PROFILE MODAL FUNCTIONS
    function openProfileModal() {
      if (!currentUser) return;
      document.getElementById('profile-name-input').value = currentUser.name;
      document.getElementById('profile-avatar-input').value = userProfiles[currentUser.name]?.avatar || "";
      document.getElementById('profile-bio-input').value = userProfiles[currentUser.name]?.bio || "";
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    function saveProfile(e) {
      e.preventDefault();
      if (!currentUser) return;
      const newAvatar = document.getElementById('profile-avatar-input').value.trim();
      const newBio = document.getElementById('profile-bio-input').value.trim();

      userProfiles[currentUser.name] = {
        avatar: newAvatar,
        bio: newBio
      };
      saveState();
      closeProfileModal();
      showToast("Profile updated successfully", "success");
      render();
    }

    // GROUP INFO MODAL FUNCTIONS
    function openGroupInfoModal() {
      const dpContainer = document.getElementById('group-dp-container');
      if (groupInfo.dp && groupInfo.dp.trim()) {
        dpContainer.innerHTML = `<img src="${groupInfo.dp}" alt="Group DP" class="w-full h-full rounded-full object-cover"/>`;
      } else {
        dpContainer.innerHTML = `<span class="material-symbols-outlined text-3xl">groups</span>`;
      }

      document.getElementById('group-name-display').innerText = groupInfo.name || "ScholarShare Workspace";
      document.getElementById('group-desc-display').innerText = groupInfo.description || "Official collaboration channel.";
      document.getElementById('group-dp-input').value = groupInfo.dp || "";
      document.getElementById('group-desc-input').value = groupInfo.description || "";

      renderMediaVault();
      renderRoster();

      document.getElementById('group-info-modal').classList.remove('hidden');
    }

    function closeGroupInfoModal() {
      document.getElementById('group-info-modal').classList.add('hidden');
      toggleEditGroupInfo(false);
    }

    function toggleEditGroupInfo(show) {
      if (show === undefined) {
        show = document.getElementById('group-info-edit-form').classList.contains('hidden');
      }

      if (show && currentUser.role !== 'Admin') {
        showGuardrailAlert();
        return;
      }

      if (show) {
        document.getElementById('group-info-edit-form').classList.remove('hidden');
      } else {
        document.getElementById('group-info-edit-form').classList.add('hidden');
      }
    }

    function saveGroupInfo() {
      if (currentUser.role !== 'Admin') {
        showGuardrailAlert();
        return;
      }

      const newDp = document.getElementById('group-dp-input').value.trim();
      const newDesc = document.getElementById('group-desc-input').value.trim();

      groupInfo.dp = newDp;
      if (newDesc) groupInfo.description = newDesc;

      saveState();
      openGroupInfoModal();
      toggleEditGroupInfo(false);
      showToast("Group information updated", "success");
      render();
    }

    function filterVault(filter) {
      vaultFilter = filter;
      ['all', 'pdf', 'image', 'other'].forEach(t => {
        const btn = document.getElementById(`vault-tab-${t}`);
        if (btn) {
          if (t === filter) {
            btn.className = "px-2 py-1 rounded-md text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 font-semibold";
          } else {
            btn.className = "px-2 py-1 rounded-md hover:text-slate-800 dark:hover:text-slate-200";
          }
        }
      });
      renderMediaVault();
    }

    function renderMediaVault() {
      const grid = document.getElementById('media-vault-grid');
      const badge = document.getElementById('vault-count-badge');
      if (!grid) return;

      let files = [];
      groupMessages.forEach(m => {
        if (m.file) files.push({ ...m.file, sender: m.sender, date: m.timestamp });
      });
      Object.values(dmThreads).flat().forEach(m => {
        if (m.file) files.push({ ...m.file, sender: m.sender, date: m.timestamp });
      });

      let filtered = files.filter(f => {
        if (vaultFilter === 'pdf') return f.type === 'pdf';
        if (vaultFilter === 'image') return f.type === 'image' || f.type === 'doc';
        if (vaultFilter === 'other') return f.type !== 'pdf' && f.type !== 'image' && f.type !== 'doc';
        return true;
      });

      badge.innerText = `${filtered.length} files`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-6 text-slate-400 text-xs">No media files found in this category.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(f => `
        <div class="flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/60 bg-white dark:bg-slate-800/60 hover:border-blue-500 transition-colors">
          <div class="w-10 h-10 rounded-lg ${f.type === 'pdf' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : f.type === 'image' ? 'bg-purple-100 text-purple-600 dark:bg-purple-900/30' : 'bg-blue-100 text-blue-600 dark:bg-blue-900/30'} flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">${f.type === 'pdf' ? 'picture_as_pdf' : f.type === 'image' ? 'image' : 'description'}</span>
          </div>
          <div class="min-w-0 flex-1">
            <h5 class="font-medium text-xs text-slate-800 dark:text-slate-200 truncate">${f.name}</h5>
            <p class="text-[10px] text-slate-400">${f.size || '1.5 MB'} • By ${f.sender}</p>
          </div>
          <button onclick="showToast('Downloading ${f.name}...', 'success')" class="text-slate-400 hover:text-blue-600 p-1">
            <span class="material-symbols-outlined text-sm">download</span>
          </button>
        </div>
      `).join('');
    }

    function renderRoster() {
      const container = document.getElementById('roster-list');
      if (!container) return;

      const isAdmin = currentUser && currentUser.role === 'Admin';

      container.innerHTML = USERS.map(u => {
        const prof = userProfiles[u.name] || u;
        const passwordDisplay = isAdmin ? u.password : '••••';
        return `
          <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-700/50">
            <div class="flex items-center gap-3">
              ${renderAvatarHTML(prof.avatar, u.name, "w-9 h-9 text-xs")}
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-xs text-slate-900 dark:text-slate-100">${u.name}</span>
                  ${u.role === 'Admin'
                    ? `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">ADMIN</span>`
                    : `<span class="px-1.5 py-0.5 text-[10px] font-medium rounded bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">MEMBER</span>`}
                </div>
                <p class="text-[11px] text-slate-400 truncate max-w-[200px]">${prof.bio || 'Scholar member'}</p>
              </div>
            </div>
            <div class="text-right">

    // COMMAND BAR ROUTER & HANDLER
    function handleCommandInput(inputVal) {
      const val = inputVal.trim();
      if (!val) return;

      if (val.startsWith('@group')) {
        const extraText = val.replace(/^@group\s*/i, '');
        currentView = 'group';
        render();
        if (extraText) {
          sendGroupMessageText(extraText);
        }
      } else if (val.startsWith('@dm')) {
        currentView = 'dm';
        render();
      } else {
        showToast("Use @group to switch to Group Workspace or @dm for DMs", "warning");
      }
    }

    // MESSAGING & EMOJI REACTIONS LOGIC
    function sendGroupMessageText(text, file = null) {
      if (!currentUser) return;

      if (currentUser.role !== 'Admin') {
        showGuardrailAlert();
        return;
      }

      if (!text.trim() && !file) return;

      const newMsg = {
        id: "gm_" + Date.now(),
        sender: currentUser.name,
        text: text.trim(),
        file: file,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        reactions: {}
      };

      groupMessages.push(newMsg);
      saveState();
      renderGroupPage();
    }

    // LOCAL FILE UPLOAD FOR GROUP WORKSPACE
    function handleGroupFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (currentUser.role !== 'Admin') {
        showGuardrailAlert();
        return;
      }

      const fileType = file.name.endsWith('.pdf') ? 'pdf' : (file.type.startsWith('image/') ? 'image' : 'doc');
      const fileSize = (file.size / (1024 * 1024)).toFixed(1) + ' MB';

      const fileObj = {
        name: file.name,
        type: fileType,
        size: fileSize
      };

      sendGroupMessageText(`Uploaded file: ${file.name}`, fileObj);
      event.target.value = '';
    }

    function toggleReaction(msgId, emoji) {
      if (!currentUser) return;
      const msg = groupMessages.find(m => m.id === msgId);
      if (!msg) return;

      if (!msg.reactions) msg.reactions = {};
      if (!msg.reactions[emoji]) msg.reactions[emoji] = [];

      const userIndex = msg.reactions[emoji].indexOf(currentUser.name);
      if (userIndex > -1) {
        msg.reactions[emoji].splice(userIndex, 1);
        if (msg.reactions[emoji].length === 0) {
          delete msg.reactions[emoji];
        }
      } else {
        msg.reactions[emoji].push(currentUser.name);
      }

      saveState();
      renderGroupPage();
    }

    // DM MESSAGING & LOCAL FILE UPLOAD LOGIC
    function getDMKey(u1, u2) {
      const sorted = [u1, u2].sort();
      return `${sorted[0]}_${sorted[1]}`;
    }

    function sendDirectMessage(recipientName, text, file = null) {
      if (!currentUser) return;
      if (!text.trim() && !file) return;

      const recipient = USERS.find(u => u.name === recipientName);
      if (currentUser.role === 'Member' && recipient.role !== 'Admin') {
        showGuardrailAlert();
        return;
      }

      const key = getDMKey(currentUser.name, recipientName);
      if (!dmThreads[key]) dmThreads[key] = [];

      dmThreads[key].push({
        id: "dm_" + Date.now(),
        sender: currentUser.name,
        text: text.trim(),
        file: file,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      saveState();
      renderDMPage();
    }

    function handleDMFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !selectedDMUser) return;

      const fileType = file.name.endsWith('.pdf') ? 'pdf' : (file.type.startsWith('image/') ? 'image' : 'doc');
      const fileSize = (file.size / (1024 * 1024)).toFixed(1) + ' MB';

      const fileObj = {
        name: file.name,
        type: fileType,
        size: fileSize
      };

      sendDirectMessage(selectedDMUser.name, `Sent file: ${file.name}`, fileObj);
      event.target.value = '';
    }

              ${msg.file ? `
                <div class="mt-2 flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-900/80 rounded-xl border border-slate-200 dark:border-slate-700">
                  <div class="w-10 h-10 rounded-lg ${msg.file.type === 'pdf' ? 'bg-red-100 text-red-600 dark:bg-red-900/30' : 'bg-purple-100 text-purple-600 dark:bg-purple-900/30'} flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-2xl">${msg.file.type === 'pdf' ? 'picture_as_pdf' : 'image'}</span>
                  </div>
                  <div class="min-w-0 flex-1">
                    <h5 class="font-bold text-xs text-slate-900 dark:text-slate-100 truncate">${msg.file.name}</h5>
                    <p class="text-[10px] text-slate-400">${msg.file.size}</p>
                  </div>
                  <button onclick="showToast('Downloading ${msg.file.name}...', 'success')" class="p-1.5 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg">
                    <span class="material-symbols-outlined text-lg">download</span>
                  </button>
                </div>
              ` : ''}

              <div class="reaction-picker absolute -top-4 ${isSelf ? 'right-2' : 'left-2'} bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full shadow-lg px-2 py-1 gap-1 z-10">
                ${EMOJIS.map(e => `
                  <button onclick="toggleReaction('${msg.id}', '${e}')" class="hover:scale-125 transition-transform text-sm p-1">
                    ${e}
                  </button>
                `).join('')}
              </div>
            </div>

            ${reactionEntries.length > 0 ? `
              <div class="flex flex-wrap gap-1 mt-1 ${isSelf ? 'justify-end' : ''}">
                ${reactionEntries.map(([emoji, users]) => {
                  const hasReacted = currentUser && users.includes(currentUser.name);
                  return `
                    <button onclick="toggleReaction('${msg.id}', '${emoji}')" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border ${hasReacted ? 'bg-blue-100 border-blue-400 text-blue-800 dark:bg-blue-900/50 dark:border-blue-700 dark:text-blue-200' : 'bg-slate-100 border-slate-200 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300'} hover:border-blue-400 transition-colors" title="${users.join(', ')}">
                      <span>${emoji}</span>
                      <span>${users.length}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function toggleThreeDotMenu() {
      const menu = document.getElementById('three-dot-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    // 4. PAGE 3: DIRECT MESSAGES (DM PAGE)
    function renderDMPage() {
      const isAdmin = currentUser.role === 'Admin';

      const selectableUsers = USERS.filter(u => u.name !== currentUser.name && (isAdmin || u.role === 'Admin'));

      if (!selectedDMUser || (currentUser.role === 'Member' && selectedDMUser.role !== 'Admin')) {
        selectedDMUser = selectableUsers[0] || null;
      }

      const activeDMKey = selectedDMUser ? getDMKey(currentUser.name, selectedDMUser.name) : null;
      const messages = activeDMKey && dmThreads[activeDMKey] ? dmThreads[activeDMKey] : [];

      return `
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
          <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="currentView='home'; render();" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 rounded-lg">
                <span class="material-symbols-outlined">arrow_back</span>
              </button>
              <div>
                <h2 class="font-bold text-sm text-slate-900 dark:text-white leading-tight">Direct Messages</h2>
                <p class="text-[11px] text-slate-500 dark:text-slate-400">
                  ${isAdmin ? 'Admin Inbox (Full Access)' : 'Submit Homework to Admins'}
                </p>
              </div>
            </div>

            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 rounded-lg">
              <span class="material-symbols-outlined">${darkMode ? 'light_mode' : 'dark_mode'}</span>
            </button>
          </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 h-[calc(100vh-5rem)]">
          <div class="w-full md:w-72 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col shrink-0 overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700">
              <h3 class="font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400">
                ${isAdmin ? 'Conversations Inbox' : 'Available Admins'}
              </h3>
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700/60">
              ${selectableUsers.map(u => {
                const isSelected = selectedDMUser && selectedDMUser.name === u.name;
                const prof = userProfiles[u.name] || u;
                return `
                  <div onclick="selectedDMUser = USERS.find(x => x.name === '${u.name}'); render();" class="p-3.5 flex items-center gap-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 ${isSelected ? 'bg-blue-50/80 dark:bg-blue-950/40 border-l-4 border-blue-600' : ''}">
                    ${renderAvatarHTML(prof.avatar, u.name, "w-10 h-10 text-xs")}
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-slate-900 dark:text-slate-100 truncate">${u.name}</span>
                        ${u.role === 'Admin' ? `<span class="px-1 text-[9px] font-bold rounded bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">ADMIN</span>` : ''}
                      </div>
                      <p class="text-[11px] text-slate-400 truncate mt-0.5">${prof.bio || 'Scholar member'}</p>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="flex-1 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col overflow-hidden">
            ${selectedDMUser ? `
              <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50">
                <div class="flex items-center gap-3">
                  ${renderAvatarHTML(userProfiles[selectedDMUser.name]?.avatar, selectedDMUser.name, "w-10 h-10 text-xs")}
                  <div>
                    <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                      <span>${selectedDMUser.name}</span>
                      ${selectedDMUser.role === 'Admin' ? `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">ADMIN</span>` : ''}
                    </h3>
                    <p class="text-[11px] text-slate-400">${userProfiles[selectedDMUser.name]?.bio || 'Scholar member'}</p>
                  </div>
                </div>
              </div>

              <div class="flex-1 p-4 overflow-y-auto space-y-3">
                ${messages.length === 0 ? `<div class="text-center py-10 text-xs text-slate-400">No messages yet. Send a message or attach a local PDF below.</div>` : ''}
                ${messages.map(m => {
                  const isSelf = m.sender === currentUser.name;
                  return `
                    <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
                      <div class="max-w-[75%] bg-slate-100 dark:bg-slate-700/80 p-3.5 rounded-2xl ${isSelf ? 'bg-blue-600 !text-white rounded-tr-none' : 'text-slate-800 dark:text-slate-100 rounded-tl-none'}">
                        ${m.text ? `<p class="text-xs leading-relaxed">${m.text}</p>` : ''}
                        ${m.file ? `
                          <div class="mt-2 flex items-center gap-2 p-2 bg-black/10 rounded-xl">
                            <span class="material-symbols-outlined text-lg">picture_as_pdf</span>
                            <div class="min-w-0 flex-1">
                              <p class="font-bold text-[11px] truncate">${m.file.name}</p>
                              <span class="text-[9px] opacity-75">${m.file.size}</span>
                            </div>
                          </div>
                        ` : ''}
                      </div>
                      <span class="text-[9px] text-slate-400 mt-1 px-1">${m.timestamp}</span>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="p-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50">
                <form onsubmit="event.preventDefault(); sendDirectMessage('${selectedDMUser.name}', document.getElementById('dm-msg-input').value); document.getElementById('dm-msg-input').value='';" class="flex items-center gap-2">
                  <button type="button" onclick="document.getElementById('dm-file-input').click()" class="p-2 text-slate-500 hover:text-blue-600 rounded-xl" title="Attach Local Homework Solution PDF">
                    <span class="material-symbols-outlined text-xl">attach_file</span>
                  </button>
                  <input type="text" id="dm-msg-input" placeholder="Type direct message or submit homework..." class="flex-1 px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-xs text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none"/>
                  <button type="submit" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md">
                    <span class="material-symbols-outlined text-lg">send</span>
                  </button>
                </form>
              </div>
            ` : `
              <div class="flex-1 flex items-center justify-center text-slate-400 text-xs">Select a user thread to start messaging.</div>
            `}
          </div>
        </main>
      `;
    }

    // MAIN RENDER CONTROLLER
    function render() {
      applyDarkMode();
      const app = document.getElementById('app');

      if (!currentUser || currentView === 'login') {
        app.innerHTML = renderLoginScreen();
      } else if (currentView === 'home') {
        app.innerHTML = renderHomePage();
      } else if (currentView === 'group') {
        app.innerHTML = renderGroupPage();
      } else if (currentView === 'dm') {
        app.innerHTML = renderDMPage();
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('login-username-input').value;
      const password = document.getElementById('login-password-input').value;
      login(username, password);
    }

    function toggleDarkMode() {
      darkMode = !darkMode;
      saveState();
      render();
    }

    // INITIAL APP INITIALIZATION
    applyDarkMode();
    render();
  </script>
</body>
</html>
